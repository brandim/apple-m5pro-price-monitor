name: Apple MacBook Pro M5 price check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # Asia/Shanghai 09:00, UTC+08:00

permissions:
  contents: write

concurrency:
  group: apple-macbook-m5-price-history
  cancel-in-progress: false

jobs:
  check:
    # Playwright 1.56.0 does not install Chromium dependencies on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest -v
      - name: Check official configured price
        id: price
        shell: bash
        run: python price_check.py 2>&1 | tee run.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-price-evidence-${{ github.run_id }}
          path: |
            evidence/
            run.log
          if-no-files-found: warn
          retention-days: 90
      - name: Persist verified history
        if: steps.price.outcome == 'success'
        run: |
          if ! git diff --quiet -- price_history.jsonl; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add price_history.jsonl
            git commit -m "Record verified MacBook Pro price"
            git push origin HEAD:${{ github.ref_name }}
          fi
