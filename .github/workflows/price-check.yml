name: Apple MacBook Pro M5 price check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # Asia/Shanghai 09:00, UTC+08:00

permissions:
  contents: write

concurrency:
  group: apple-macbook-m5-price-history
  cancel-in-progress: false

jobs:
  check:
    # Playwright 1.56.0 does not install Chromium dependencies on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest -v
      - name: Check official configured price
        id: price
        shell: bash
        env:
          PRICE_RESULT_POINTER: ${{ runner.temp }}/apple-price-result-path.txt
        run: python price_check.py 2>&1 | tee run.log
      - name: Build public latest result
        id: publish
        if: always()
        run: python publish_latest.py build --result-pointer "$RUNNER_TEMP/apple-price-result-path.txt"
      - name: Validate public JSON and browser evidence
        id: validate
        if: always() && steps.publish.outcome == 'success'
        run: python publish_latest.py validate --result-pointer "$RUNNER_TEMP/apple-price-result-path.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-price-evidence-${{ github.run_id }}
          path: |
            evidence/
            run.log
            latest-price.json
          if-no-files-found: warn
          retention-days: 90
      - name: Publish latest result and verified history
        if: always() && steps.validate.outcome == 'success' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- latest-price.json price_history.jsonl; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add latest-price.json price_history.jsonl
            git commit -m "Publish latest MacBook Pro price status"
            git push origin HEAD:${{ github.ref_name }}
          fi
